name: Singularity
description: >-
  Singularity (Singularity Defense Corp) is a defense-technology company building
  low-cost, mass-producible air-defense and counter-weapon systems to protect
  warfighters and civilians from drones and cheap aerial munitions. Founded by
  engineers from SpaceX, Tesla, and Anduril alongside operators who have deployed
  air defenses in combat, the company emerged from stealth in July 2026 with an $80M
  Series A at a $400M valuation led by Khosla Ventures and Felicis, with Menlo
  Ventures, NEA, Y Combinator, Harpoon Ventures, and others participating. It
  emphasizes in-house manufacturing of major subsystems combined with commercial-volume
  components for rapid production and field deployment, including active conflict zones.
  Singularity is a hardware defense company and does not publish a public API, developer
  portal, or SDKs. This profile was surfaced as a Menlo Ventures portfolio lead and
  enriched with verified company identity by the API Evangelist pipeline.
